[package]
name    = "sit"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sit"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"
# Async runtime
tokio        = { version = "1",  features = ["full"] }

# HTTP client
reqwest      = { version = "0.12", features = ["json"] }

# JSON parsing (GitHub API)
serde_json   = "1"

# HTML parsing — replaces the fragile split("href=\"") approach
scraper      = "0.21"

# URL encoding / decoding
urlencoding  = "2"

# URL parsing (scheme, host extraction, relative → absolute resolution)
url          = "2"

# Regex (GitHub Pivot detection, asset URL extraction from scripts)
regex        = "1"

# Interactive TUI selector
dialoguer    = { version = "0.11", features = ["completion"] }

# Base64 decode (Bing search URL decoding)
base64       = "0.22"

# Progress bar
indicatif    = "0.17"


[profile.release]
opt-level = 3
lto       = true
strip     = true